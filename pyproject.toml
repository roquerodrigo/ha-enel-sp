[project]
# Este repositório é uma integração custom do Home Assistant entregue como
# ``custom_components/enel_sp/``, não um pacote instalável via pip. O bloco
# ``[project]`` existe para que o uv reconheça o diretório como um projeto
# gerenciado; ``[tool.uv] package = false`` impede o uv de tentar
# construí-lo/instalá-lo.
name = "ha-enel-sp"
version = "1.0.0"
description = "Integração do Home Assistant para a área do cliente da Enel São Paulo"
requires-python = ">=3.14.2"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "homeassistant==2026.7.2",
    "pre-commit==4.6.2",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.346",
]
lint = [
    "ruff==0.16.6",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=custom_components/enel_sp",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/enel_sp"]
ignore_missing_imports = true
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# A configuração do Ruff espelha o pyproject.toml do core do Home Assistant.
[tool.ruff]
target-version = "py314"

[tool.ruff.format]
exclude = ["*.md"]  # ruff 0.16 formats Python blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # expressões tipadas dinamicamente (typing.Any) são proibidas
    "D203",    # no-blank-line-before-class (incompatível com o formatter)
    "D212",    # multi-line-summary-first-line (incompatível com o formatter)
    "COM812",  # incompatível com o formatter
    "ISC001",  # incompatível com o formatter
    "CPY001",  # cabeçalhos de copyright não são usados neste projeto
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# A dataclass de runtime data fica no subpacote data/, mas referencia os tipos
# ApiClient e coordinator do pacote pai; um import relativo ao pai é a única
# forma que resolve tanto no mypy quanto no runtime do HA.
"**/data/runtime.py" = ["TID252"]
"**/sensor/*.py" = ["TID252"]
"tests/**" = [
    "S101",     # assert is normal in pytest
    "S105",     # hardcoded-password-string is fine for fake test credentials
    "S106",     # hardcoded-password-func-arg is fine for fake test credentials
    "D",        # no docstrings required in tests
    "ANN",      # no type annotations required in tests
    "ARG001",   # fixtures are used implicitly by pytest
    "PLC0415",  # local imports inside fixtures are intentional
    "SLF001",   # testing private HA attrs and internal methods is intentional
    "PLR2004",  # magic numbers in test assertions are fine
]
