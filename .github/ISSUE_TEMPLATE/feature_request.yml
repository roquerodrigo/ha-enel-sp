---
name: "Pedido de funcionalidade"
description: "Sugira uma ideia para este projeto"
body:
- type: markdown
  attributes:
    value: Antes de abrir um novo pedido de funcionalidade, pesquise nos pedidos existentes para ver se outras pessoas tiveram a mesma ideia.
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: Preenchi o template da melhor forma que pude.
        required: true
      - label: Este pedido contém apenas 1 funcionalidade (se houver vários pedidos, abra um para cada funcionalidade).
        required: true
      - label: Este pedido não é duplicata de nenhum dos [pedidos anteriores](../../issues?q=is%3Aissue+label%3A%22Feature+Request%22+).
        required: true

- type: textarea
  attributes:
    label: "O pedido está relacionado a um problema? Descreva."
    description: "Uma descrição clara e concisa do problema."
    placeholder: "Sempre me frustro quando [...]"
  validations:
    required: true

- type: textarea
  attributes:
    label: "Descreva a solução que você gostaria"
    description: "Uma descrição clara e concisa do que você quer que aconteça."
  validations:
    required: true

- type: textarea
  attributes:
    label: "Descreva as alternativas que você considerou"
    description: "Uma descrição clara e concisa de soluções ou funcionalidades alternativas que você considerou."
  validations:
    required: true

- type: textarea
  attributes:
    label: "Contexto adicional"
    description: "Adicione aqui qualquer outro contexto ou capturas de tela sobre o pedido."
  validations:
    required: true
