name: Release

# Condicionado a uma execução verde do CI, e não ao push em si. A metade
# `workflow_run.event == 'push'` da condição é o que impede um pull request com
# CI verde de gerar uma release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    uses: roquerodrigo/release-autopilot/.github/workflows/release.yml@latest
    secrets:
      token: ${{ secrets.RELEASE_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    uses: roquerodrigo/workflows/.github/workflows/publish-hacs-zip.yml@main
    with:
      domain: enel_sp
      ref: ${{ needs.release.outputs.tag }}
